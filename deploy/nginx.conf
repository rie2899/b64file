# b64file 站点配置（挂在 nginx 容器的 /etc/nginx/conf.d/default.conf）
# 证书：腾讯云免费 DV 证书下载 nginx 格式，放 ./certs/b64file.cn.pem + .key

server {
    listen 80;
    server_name b64file.cn www.b64file.cn;
    return 301 https://b64file.cn$request_uri;
}

# 证书 SAN 同时覆盖 www，https://www 也能直达
server {
    listen 443 ssl;
    http2 on;
    server_name www.b64file.cn;
    ssl_certificate     /etc/nginx/certs/b64file.cn.pem;
    ssl_certificate_key /etc/nginx/certs/b64file.cn.key;
    return 301 https://b64file.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name b64file.cn;

    ssl_certificate     /etc/nginx/certs/b64file.cn.pem;
    ssl_certificate_key /etc/nginx/certs/b64file.cn.key;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物带 hash，放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML 不缓存，发新版立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
