<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>b64file</title>
    <meta name="description" content="Base64 工具" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('b64file-theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-page="image-to-base64">
    <div id="app"></div>
  </body>
</html>
